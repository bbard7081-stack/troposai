services:
  crm_app:
    build: .
    container_name: tropos_crm
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/crm_data.db
    env_file:
      - .env

  crm_staging:
    build: .
    container_name: tropos_staging
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/test_data.db
    env_file:
      - .env
